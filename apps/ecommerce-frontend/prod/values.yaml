appName: "ecommerce-frontend"
environment: "prod"
replicaCount: 5

image:
  repository: "ghcr.io/contoso/ecommerce-frontend"
  tag: "v3.2.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  host: "store.contoso.com"
  tls:
    enabled: true
    secretName: "prod-frontend-tls"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPU: 70
